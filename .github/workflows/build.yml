name: Build APK

# Tag v1.0.0 = new release (APK attached to this repo's Releases). "Run workflow" = test build (APK under Artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Aksi dikunci ke SHA commit (bukan tag) supaya tidak bisa diganti diam-diam oleh pihak lain
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'

      - name: Kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secret KEYSTORE_B64 belum diisi"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jubeli.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/jubeli.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSI_KODE: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export VERSI_NAMA="${GITHUB_REF_NAME#v}"; else export VERSI_NAMA="0.0.$GITHUB_RUN_NUMBER-uji"; fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk jubeli-pos.apk
          rm -f "$RUNNER_TEMP/jubeli.p12"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: '*.apk'

      - name: Rilis
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jubeli-pos.apk --title "Jubeli POS $GITHUB_REF_NAME" --notes "Jubeli POS: Android app for https://jubeliwatch.github.io/admin.html"
